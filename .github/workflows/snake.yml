# Generates the contribution-snake animation used in README.md.
# It commits the SVG to the `output` branch, which the README reads from.
name: Generate snake animation

on:
  schedule:
    - cron: "0 2 * * *"      # daily at 02:00 UTC
  workflow_dispatch:          # or run it by hand
  push:
    branches: [master, main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-dark&color_snake=#F25C05
            dist/snake-light.svg?palette=github-light&color_snake=#F25C05

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
